services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - inventory_sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__InventoryDb: "Server=sql,1433;Database=${SQL_DATABASE:-InventoryManagementDb};User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Authentication__Authority: "http://host.docker.internal:8080/realms/inventory"
      Authentication__ValidIssuer: "http://localhost:8080/realms/inventory"
      Authentication__Audience: "inventory-api"
    ports:
      - "5285:8080"
    depends_on:
      sql:
        condition: service_healthy

volumes:
  inventory_sql_data:
    external: true
